name: V3.1.21 validation
on:
  push:
    branches:
      - agent/uai-perto-v3.1.21-formularios
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check assets/participacao.js
          node --check api/contact.js
      - name: Form structure checks
        run: |
          grep -q 'id="consumer-form"' participar.html
          grep -q 'id="company-form"' participar.html
          grep -q 'data-profile-target="consumidor"' participar.html
          grep -q 'data-profile-target="empresa"' participar.html
          grep -q 'id="consumer-contact-fields" hidden' participar.html
          grep -q 'href="/calculadora.html"' participar.html
          grep -q 'Pesquisa do consumidor — pré-lançamento' assets/participacao.js
          grep -q 'Interesse empresarial — participação na Rede' assets/participacao.js
      - name: Historical test comparison
        shell: bash
        run: |
          set +e
          npm test > /tmp/tests.log 2>&1
          status=$?
          set -e
          cat /tmp/tests.log
          failures=$(grep -c '^not ok ' /tmp/tests.log || true)
          echo "test_exit=$status failures=$failures"
          if [ "$status" -eq 0 ]; then
            echo "Suite became fully green; acceptable."
            exit 0
          fi
          if [ "$failures" -ne 13 ]; then
            echo "Unexpected test delta: expected historical 13 failures, got $failures"
            exit 1
          fi
          echo "Same 13 historical failures as validated baseline."
