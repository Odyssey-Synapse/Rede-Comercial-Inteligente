name: V3.1.20 finalize

on:
  push:
    branches:
      - agent/uai-perto-v3.1.20-foco-mobile-participacao

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore compatible base and validate
        shell: bash
        run: |
          sed -i 's/const base=950;/const base=1120;/' assets/home-demo.js
          node --check assets/home-demo.js
          npm ci
          set +e
          npm test > /tmp/tests.log 2>&1
          code=$?
          set -e
          failures=$(grep -c '^not ok ' /tmp/tests.log || true)
          echo "test_exit=$code failures=$failures"
          grep '^not ok ' /tmp/tests.log || true
          if [ "$failures" -ne 13 ]; then
            echo "A V3.1.20 deve manter exatamente as 13 falhas históricas da main."
            exit 1
          fi
      - name: Final scope checks
        shell: bash
        run: |
          node --check assets/site.js
          if grep -R '/calculadora.html' index.html rede.html tecnologia.html transparencia.html contato.html privacidade.html participar.html; then
            echo 'Calculadora exposta fora da jornada empresarial.'
            exit 1
          fi
          grep -q 'href="/calculadora.html"' empresas.html
          grep -q 'href="/participar.html"' index.html
          grep -q '/participar.html' assets/site.js
          test -f assets/uai-perto-logo-horizontal-hd.png
          grep -q '"version": "3.1.20"' package.json
      - name: Commit final adjustment and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home-demo.js
          git rm .github/workflows/v3-1-20-finalize.yml
          git commit -m 'Finaliza validação técnica da V3.1.20'
          git push
