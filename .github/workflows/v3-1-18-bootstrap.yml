name: Bootstrap V3.1.18

on:
  push:
    branches:
      - agent/uai-perto-v3.1.18

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Bootstrap V3.1.18 updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uai-perto-v3.1.18
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Medir baseline V3.1.17
        shell: bash
        run: |
          git worktree add /tmp/baseline origin/main
          cd /tmp/baseline
          npm ci
          set +e
          npm test > /tmp/baseline.tap 2>&1
          BASE_EXIT=$?
          set -e
          grep -E '^not ok [0-9]+ - ' /tmp/baseline.tap | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/baseline-fails.txt || true
          echo "Baseline exit: $BASE_EXIT"
          echo "Falhas baseline: $(wc -l < /tmp/baseline-fails.txt)"
          cat /tmp/baseline-fails.txt

      - name: Aplicar V3.1.18
        run: |
          python3 .github/v3-1-18-update.py
          python3 .github/v3-1-18-fix-copy.py

      - name: Auditar referencias publicas legadas
        run: |
          if grep -Ein 'Projeto RLI|Rede RLI|REDE RLI|nome provisório|Achei Aqui|>RLI<|REDE<br>RLI' index.html rede.html empresas.html tecnologia.html transparencia.html calculadora.html contato.html privacidade.html; then
            echo 'Foram encontradas referencias publicas legadas.'
            exit 1
          fi

      - name: Verificar sintaxe
        run: |
          npm ci
          node --check assets/site.js
          node --check assets/capacity-calculator.js

      - name: Comparar testes com baseline
        shell: bash
        run: |
          set +e
          npm test > /tmp/v318.tap 2>&1
          NEW_EXIT=$?
          set -e
          grep -E '^not ok [0-9]+ - ' /tmp/v318.tap | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/v318-fails.txt || true
          echo "V3.1.18 exit: $NEW_EXIT"
          echo "Falhas V3.1.18: $(wc -l < /tmp/v318-fails.txt)"
          cat /tmp/v318-fails.txt
          echo '--- Diferenca de falhas versus baseline ---'
          diff -u /tmp/baseline-fails.txt /tmp/v318-fails.txt || true
          comm -13 /tmp/baseline-fails.txt /tmp/v318-fails.txt > /tmp/new-regressions.txt
          echo "Novas falhas: $(wc -l < /tmp/new-regressions.txt)"
          cat /tmp/new-regressions.txt
          if [ -s /tmp/new-regressions.txt ]; then
            echo 'A V3.1.18 introduziu falhas novas. Bloqueando commit.'
            exit 1
          fi

      - name: Confirmar escopo do diff
        run: |
          git diff --name-only
          if git diff --name-only | grep -E '^(api/|lib/|migrations/|tests/|vercel\.json$)'; then
            echo 'Mudanca fora do escopo seguro detectada.'
            exit 1
          fi

      - name: Commitar V3.1.18
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html rede.html empresas.html tecnologia.html transparencia.html calculadora.html contato.html privacidade.html assets/site.js assets/capacity-calculator.js assets/uai-perto.css package.json package-lock.json RELEASE_NOTES_V3_1_18.md VALIDACAO_V3_1_18.md
          git commit -m 'V3.1.18 consolida marca e nitidez das copys'
          git push origin HEAD:agent/uai-perto-v3.1.18
